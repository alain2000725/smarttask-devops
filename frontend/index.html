<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTask - Gestion de tâches</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-tasks"></i>
                    <span>SmartTask</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active">
                        <i class="fas fa-home"></i>
                        <span>Tableau de bord</span>
                    </li>
                    <li>
                        <i class="fas fa-list-check"></i>
                        <span>Mes tâches</span>
                    </li>
                    <li>
                        <i class="fas fa-calendar"></i>
                        <span>Planning</span>
                    </li>
                    <li>
                        <i class="fas fa-users"></i>
                        <span>Équipe</span>
                    </li>
                    <li>
                        <i class="fas fa-cog"></i>
                        <span>Paramètres</span>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar">JD</div>
                    <div>
                        <p class="user-name">John Doe</p>
                        <p class="user-role">Administrateur</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h1>Tableau de bord</h1>
                    <p>Bienvenue sur SmartTask</p>
                </div>
                <div class="header-right">
                    <div class="notification">
                        <i class="fas fa-bell"></i>
                        <span class="badge">3</span>
                    </div>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Rechercher...">
                    </div>
                </div>
            </header>

            <!-- Stats Cards -->
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: #e8f5e9; color: #2e7d32;">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-info">
                        <h3>12</h3>
                        <p>Tâches terminées</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #fff3e0; color: #e65100;">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-info">
                        <h3>5</h3>
                        <p>En cours</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #fce4ec; color: #c62828;">
                        <i class="fas fa-exclamation-circle"></i>
                    </div>
                    <div class="stat-info">
                        <h3>2</h3>
                        <p>En retard</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #e3f2fd; color: #0d47a1;">
                        <i class="fas fa-plus-circle"></i>
                    </div>
                    <div class="stat-info">
                        <h3>8</h3>
                        <p>À faire</p>
                    </div>
                </div>
            </section>

            <!-- Add Task Form -->
            <section class="task-form-section">
                <h2><i class="fas fa-plus-circle"></i> Ajouter une tâche</h2>
                <form id="taskForm" class="task-form">
                    <div class="form-row">
                        <input type="text" id="taskTitle" placeholder="Titre de la tâche" required>
                        <select id="taskPriority">
                            <option value="low">🟢 Priorité basse</option>
                            <option value="medium" selected>🟡 Priorité moyenne</option>
                            <option value="high">🔴 Priorité haute</option>
                        </select>
                        <button type="submit" class="btn-add">
                            <i class="fas fa-plus"></i> Ajouter
                        </button>
                    </div>
                </form>
            </section>

            <!-- Task List -->
            <section class="task-list-section">
                <div class="task-list-header">
                    <h2><i class="fas fa-list"></i> Liste des tâches</h2>
                    <div class="task-filters">
                        <button class="filter-btn active" data-filter="all">Toutes</button>
                        <button class="filter-btn" data-filter="pending">En cours</button>
                        <button class="filter-btn" data-filter="completed">Terminées</button>
                    </div>
                </div>
                <div id="taskList" class="task-list">
                    <!-- Les tâches seront insérées dynamiquement -->
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>

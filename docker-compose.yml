services:
  # Base de données PostgreSQL
  database:
    image: yvesmayombo/smarttask-db:v1
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpass
      POSTGRES_DB: smarttask
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smarttask-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartuser -d smarttask"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: yvesmayombo/smarttask-backend:v1
    container_name: backend
    restart: always
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      DB_HOST: database
      DB_USER: smartuser
      DB_PASSWORD: smartpass
      DB_NAME: smarttask
    depends_on:
      database:
        condition: service_healthy
    networks:
      - smarttask-network

  # Frontend
  frontend:
    image: yvesmayombo/smarttask-frontend:v1
    container_name: frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - smarttask-network

# Volumes persistants
volumes:
  postgres_data:

# Réseau dédié
networks:
  smarttask-network:
    driver: bridge
